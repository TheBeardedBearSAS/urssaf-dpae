deptrac:
  paths:
    - ./src
    - ./vendor/psr
  cache_file: var/.deptrac.cache
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Testing
      collectors:
        - type: directory
          value: src/Testing/.*
    - name: Standalone
      collectors:
        - type: directory
          value: src/Standalone/.*
    - name: SymfonyBridge
      collectors:
        - type: directory
          value: src/Bridge/Symfony/.*
    - name: DoctrineBridge
      collectors:
        - type: directory
          value: src/Bridge/Doctrine/.*
    - name: Psr
      collectors:
        - type: classLike
          value: ^Psr\\
    - name: Symfony
      collectors:
        - type: classLike
          value: ^Symfony\\
    - name: Doctrine
      collectors:
        - type: classLike
          value: ^Doctrine\\
  ruleset:
    Domain: ~
    Contract: ~
    Application:
      - Domain
      - Contract
    Infrastructure:
      - Application
      - Domain
      - Contract
      - Psr
    DoctrineBridge:
      - Domain
      - Contract
      - Application
      - Infrastructure
      - Doctrine
      - Psr
    # The simulator (ADR 0003) is in-memory URSSAF: it implements the application ports on the domain, and nothing else
    # (no Infrastructure, no Contract).
    Testing:
      - Domain
      - Application
    # The standalone entry point has no Symfony (ADR 0000 section 1); the Doctrine bridge is its opt-in persistence.
    Standalone:
      - Domain
      - Contract
      - Application
      - Infrastructure
      - DoctrineBridge
      - Doctrine
      - Psr
    # The bridge depends on Testing for one reason: the container factory of the simulated gateway (`gateway.simulated`,
    # tests of the host application, ADR 0003 and 0009) instantiates SimulatedDpaeGateway.
    SymfonyBridge:
      - Domain
      - Contract
      - Application
      - Infrastructure
      - Testing
      - DoctrineBridge
      - Symfony
      - Doctrine
      - Psr
